<!DOCTYPE html>
<html>
<head>
    <title>Gurka Test</title>
</head>
<body>
    <h1>Testing Gurka Game</h1>
    <div id="test-output"></div>
    
    <script>
        // Test if the script loads and runs
        document.getElementById('test-output').innerHTML = 'JavaScript is working!<br>';
        
        // Load the game script
        const script = document.createElement('script');
        script.src = 'script.js';
        script.onload = () => {
            document.getElementById('test-output').innerHTML += 'Script loaded successfully!<br>';
        };
        script.onerror = (e) => {
            document.getElementById('test-output').innerHTML += 'Script failed to load: ' + e + '<br>';
        };
        document.head.appendChild(script);
        
        // Check for syntax errors
        window.addEventListener('error', (e) => {
            document.getElementById('test-output').innerHTML += 'Error: ' + e.message + ' at line ' + e.lineno + '<br>';
        });
    </script>
</body>
</html>
