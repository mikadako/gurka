<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurka - Card Game</title>
    <style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #2d4a2b;
    color: white;
}

.screen {
    min-height: 100vh;
    padding: 20px;
}

.hidden {
    display: none !important;
}

#setup-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

h1 {
    font-size: 3em;
    margin-bottom: 40px;
}

.setup-container {
    background: rgba(0, 0, 0, 0.3);
    padding: 30px;
    border-radius: 10px;
    text-align: center;
}

label {
    display: block;
    margin-bottom: 10px;
    font-size: 1.2em;
}

input[type="number"] {
    width: 80px;
    padding: 10px;
    font-size: 1.2em;
    text-align: center;
    margin-bottom: 20px;
}

button {
    padding: 10px 30px;
    font-size: 1.2em;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s;
}

button:hover {
    background-color: #45a049;
}

button:disabled {
    background-color: #666;
    cursor: not-allowed;
}

.game-info {
    text-align: center;
    margin-bottom: 20px;
}

#other-players {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 30px;
}

.other-player {
    background: rgba(0, 0, 0, 0.3);
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    min-width: 150px;
}

.player-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.card-count {
    font-size: 0.9em;
    color: #ccc;
}

.player-score {
    margin-top: 5px;
    color: #ff9800;
}

#play-area {
    background: rgba(0, 0, 0, 0.2);
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 30px;
    text-align: center;
}

#trick-cards {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
    min-height: 100px;
    margin-top: 20px;
}

.trick-card {
    position: relative;
    margin-bottom: 10px;
}

.trick-player-name {
    font-size: 0.8em;
    margin-bottom: 5px;
}

#player-area {
    background: rgba(0, 0, 0, 0.3);
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 30px;
    text-align: center;
}

#player-hand {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
    min-height: 100px;
}

.card {
    width: 70px;
    height: 100px;
    border: 2px solid #333;
    border-radius: 5px;
    background: white;
    color: black;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s;
    font-size: 1.2em;
    position: relative;
}

.card:hover:not(.disabled) {
    transform: translateY(-10px);
}

.card.disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.card.red {
    color: red;
}

.card.playable {
    border: 3px solid #4CAF50;
    box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
}

.card-rank {
    font-size: 1.5em;
    font-weight: bold;
}

.card-suit {
    font-size: 1.8em;
    margin-top: 5px;
}

.card-corner {
    position: absolute;
    top: 3px;
    left: 3px;
    font-size: 0.8em;
    line-height: 1;
    text-align: center;
}

.card-corner-rank {
    font-weight: bold;
}

.card-corner-suit {
    font-size: 0.9em;
}

#scoreboard {
    background: rgba(0, 0, 0, 0.3);
    padding: 20px;
    border-radius: 10px;
    max-width: 600px;
    margin: 0 auto;
}

#scores {
    margin-top: 15px;
}

.score-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.eliminated {
    text-decoration: line-through;
    opacity: 0.5;
}

.high-card {
    background-color: #ff9800;
    color: white;
    border: 3px solid #ff5722;
    box-shadow: 0 0 15px rgba(255, 87, 34, 0.8);
}

.high-card.red {
    color: white;
}

#player-info {
    margin-top: 20px;
    font-size: 1.1em;
}

.winner-message {
    text-align: center;
    font-size: 2em;
    color: #4CAF50;
    margin: 20px 0;
}

#player-piles {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 20px;
    margin: 20px 0;
    min-height: 200px;
}

.player-pile {
    text-align: center;
    min-width: 120px;
}

.pile-name {
    font-weight: bold;
    margin-bottom: 10px;
}

.pile-cards {
    position: relative;
    height: 120px;
    margin: 0 auto;
    width: 220px;
}

.pile-card {
    position: absolute;
    left: 0;
    top: 0;
}

.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-content {
    background-color: #3d5a3b;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
}

#round-end-message {
    font-size: 1.4em;
    margin-bottom: 20px;
}

#continue-button {
    padding: 15px 40px;
    font-size: 1.2em;
}

<body>
    <div id="setup-screen" class="screen">
        <h1>Välkommen till Gurka!</h1>
        <div class="setup-container">
            <label for="player-count">Antal spelare (2-8):</label>
            <input type="number" id="player-count" min="2" max="8" value="4">
            <button id="start-game">Starta spel</button>
        </div>
    </div>

    <div id="game-screen" class="screen hidden">
        <div class="game-info">
            <h2>Gurka</h2>
            <div id="current-player"></div>
            <div id="game-status"></div>
        </div>

        <div id="play-area">
            <div id="player-piles"></div>
        </div>

        <div id="player-area">
            <h3>Dina kort</h3>
            <div id="player-hand"></div>
            <div id="player-info"></div>
        </div>

        <div id="scoreboard">
            <h3>Poäng</h3>
            <div id="scores"></div>
        </div>

        <div id="round-end-modal" class="modal hidden">
            <div class="modal-content">
                <div id="round-end-message"></div>
                <button id="continue-button">Fortsätt</button>
            </div>
        </div>
    </div>

    <script>
class Card {
    constructor(suit, rank) {
        this.suit = suit;
        this.rank = rank;
        this.value = rank === 1 ? 14 : rank; // Ace is high (14)
    }

    getDisplayRank() {
        if (this.rank === 1) return 'A';
        if (this.rank === 11) return 'J';
        if (this.rank === 12) return 'Q';
        if (this.rank === 13) return 'K';
        return this.rank.toString();
    }

    getSuitSymbol() {
        const suits = {
            'hearts': '♥',
            'diamonds': '♦',
            'clubs': '♣',
            'spades': '♠'
        };
        return suits[this.suit];
    }

    isRed() {
        return this.suit === 'hearts' || this.suit === 'diamonds';
    }
}

class Player {
    constructor(name, isHuman = false) {
        this.name = name;
        this.isHuman = isHuman;
        this.hand = [];
        this.score = 0;
        this.eliminated = false;
    }

    sortHand() {
        this.hand.sort((a, b) => a.value - b.value);
    }

    getLowestCard() {
        return this.hand[0];
    }

    getValidCards(highCard) {
        const lowestCard = this.getLowestCard();
        const validCards = [];

        if (!highCard) {
            return this.hand;
        }

        validCards.push(lowestCard);

        const higherCards = this.hand.filter(card => card.value > highCard.value);
        if (higherCards.length > 0) {
            validCards.push(higherCards[0]);
        }

        return validCards;
    }

    playCard(card) {
        const index = this.hand.findIndex(c =>
            c.suit === card.suit && c.rank === card.rank
        );
        if (index > -1) {
            return this.hand.splice(index, 1)[0];
        }
        return null;
    }
}

// Lightweight simulation engine used by the PIMC AI.
// Mirrors the GurkaGame rules: when following, you must play your lowest card
// or the smallest card higher than the current high card.
class SimGame {
    constructor(hands, currentPlayerIndex, trickCards, trickPlayers, highCard, highCardPlayerIndex, scores, eliminated) {
        this.hands = hands.map(h => h.slice());
        this.currentPlayerIndex = currentPlayerIndex;
        this.trickCards = trickCards.slice();
        this.trickPlayers = trickPlayers.slice();
        this.highCard = highCard;
        this.highCardPlayerIndex = highCardPlayerIndex;
        this.scores = scores.slice();
        this.eliminated = eliminated.slice();
        this.numPlayers = hands.length;
        this.roundEnded = false;
    }

    activePlayerCount() {
        let count = 0;
        for (let i = 0; i < this.numPlayers; i++) {
            if (!this.eliminated[i]) count++;
        }
        return count;
    }

    getValidCards(playerIndex) {
        const hand = this.hands[playerIndex];
        if (hand.length === 0) return [];
        const sorted = hand.slice().sort((a, b) => a.value - b.value);
        if (!this.highCard) return sorted;
        const lowest = sorted[0];
        const result = [lowest];
        const higher = sorted.find(c => c.value > this.highCard.value);
        if (higher && higher !== lowest) result.push(higher);
        return result;
    }

    playCard(playerIndex, card) {
        const hand = this.hands[playerIndex];
        const idx = hand.findIndex(c => c.suit === card.suit && c.rank === card.rank);
        if (idx < 0) {
            this.roundEnded = true;
            return;
        }
        hand.splice(idx, 1);
        this.trickCards.push(card);
        this.trickPlayers.push(playerIndex);
        if (!this.highCard || card.value > this.highCard.value) {
            this.highCard = card;
            this.highCardPlayerIndex = playerIndex;
        }
        if (this.trickCards.length === this.activePlayerCount()) {
            this.endTrick();
        } else {
            do {
                this.currentPlayerIndex = (this.currentPlayerIndex + 1) % this.numPlayers;
            } while (this.eliminated[this.currentPlayerIndex]);
        }
    }

    endTrick() {
        let allEmpty = true;
        for (let i = 0; i < this.numPlayers; i++) {
            if (!this.eliminated[i] && this.hands[i].length > 0) {
                allEmpty = false;
                break;
            }
        }

        if (allEmpty) {
            // Score the final trick — only the highest card(s) score.
            let maxValue = 0;
            const winners = [];
            for (let i = 0; i < this.trickCards.length; i++) {
                const v = this.trickCards[i].value;
                if (v > maxValue) {
                    maxValue = v;
                    winners.length = 0;
                    winners.push(this.trickPlayers[i]);
                } else if (v === maxValue) {
                    winners.push(this.trickPlayers[i]);
                }
            }
            for (const pi of winners) {
                if (maxValue === 14) {
                    this.eliminated[pi] = true;
                } else {
                    this.scores[pi] += maxValue;
                    if (this.scores[pi] >= 50) this.eliminated[pi] = true;
                }
            }
            this.roundEnded = true;
        } else {
            this.currentPlayerIndex = this.highCardPlayerIndex;
            this.trickCards = [];
            this.trickPlayers = [];
            this.highCard = null;
            this.highCardPlayerIndex = null;
        }
    }

    // Rollout policy: leading dumps the highest card, following plays the
    // lowest. This captures the core Gurka idea of saving low cards for the
    // scoring final trick while shedding high ones early.
    chooseRolloutCard(playerIndex) {
        const valid = this.getValidCards(playerIndex);
        if (valid.length === 1) return valid[0];
        if (!this.highCard) {
            const hand = this.hands[playerIndex];
            let highest = hand[0];
            for (const c of hand) {
                if (c.value > highest.value) highest = c;
            }
            return highest;
        }
        return valid[0];
    }

    simulateToEnd() {
        let safety = 200;
        while (!this.roundEnded && safety-- > 0) {
            const card = this.chooseRolloutCard(this.currentPlayerIndex);
            this.playCard(this.currentPlayerIndex, card);
        }
    }
}

class GurkaGame {
    constructor() {
        this.players = [];
        this.currentPlayerIndex = 0;
        this.trickCards = [];
        this.trickPlayers = [];
        this.deck = [];
        this.highCard = null;
        this.highCardPlayerIndex = null;
        this.gameActive = false;
        this.roundNumber = 0;
        this.playerPiles = {};
        this.playedCards = new Set(); // Track all played cards
        this.remainingCardsByValue = {}; // Track remaining cards by value
        this.playerMinimumCard = {}; // Track minimum possible card for each player

        this.setupEventListeners();
    }

    setupEventListeners() {
        const startButton = document.getElementById('start-game');
        console.log('Start button:', startButton);
        if (startButton) {
            startButton.addEventListener('click', () => {
                console.log('Start button clicked');
                this.startGame();
            });
        } else {
            console.error('Start button not found!');
        }

        const continueButton = document.getElementById('continue-button');
        if (continueButton) {
            continueButton.addEventListener('click', () => {
                this.continueAfterRound();
            });
        }
    }

    generateFunnyNames() {
        const allNames = ['Grattgård', 'Lansén', 'Henry Florén', 'Janne Rundquist', 'Charlie', 'Andy', 'Bosse Andersson', 'Torgny', 'Kalle Klöver'];
        const shuffled = [...allNames];

        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }

        return shuffled;
    }

    startGame() {
        console.log('startGame called');
        const playerCountInput = document.getElementById('player-count');
        console.log('Player count input:', playerCountInput);
        const playerCount = parseInt(playerCountInput.value);
        console.log('Player count:', playerCount);
        if (playerCount < 2 || playerCount > 8) {
            alert('Välj mellan 2 och 8 spelare');
            return;
        }

        this.players = [new Player('Du', true)];

        const funnyNames = this.generateFunnyNames();
        for (let i = 0; i < playerCount - 1; i++) {
            this.players.push(new Player(funnyNames[i], false));
        }

        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');

        console.log('Setup screen:', setupScreen);
        console.log('Game screen:', gameScreen);

        if (setupScreen && gameScreen) {
            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            console.log('Screens switched');
        } else {
            console.error('Could not find screens!');
            return;
        }

        this.gameActive = true;
        console.log('About to start new round');
        this.startNewRound();
    }

    createDeck() {
        const suits = ['hearts', 'diamonds', 'clubs', 'spades'];
        const deck = [];

        for (const suit of suits) {
            for (let rank = 1; rank <= 13; rank++) {
                deck.push(new Card(suit, rank));
            }
        }

        for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }

        return deck;
    }

    startNewRound() {
        this.roundNumber++;
        this.deck = this.createDeck();
        this.trickCards = [];
        this.trickPlayers = [];
        this.highCard = null;
        this.highCardPlayerIndex = null;
        this.playedCards.clear();

        // Initialize card counting
        this.remainingCardsByValue = {};
        for (let i = 2; i <= 14; i++) {
            this.remainingCardsByValue[i] = 4; // 4 of each rank in deck
        }

        // Initialize player piles and minimum card tracking
        this.players.forEach((player, index) => {
            this.playerPiles[index] = [];
            this.playerMinimumCard[index] = 2; // Reset to lowest possible
        });

        this.players.forEach(player => {
            if (!player.eliminated) {
                player.hand = [];
                for (let i = 0; i < 6; i++) {
                    player.hand.push(this.deck.pop());
                }
                player.sortHand();
            }
        });

        this.updateDisplay();

        if (!this.players[this.currentPlayerIndex].eliminated) {
            this.nextTurn();
        } else {
            this.findNextActivePlayer();
            this.nextTurn();
        }
    }

    findNextActivePlayer() {
        let attempts = 0;
        while (this.players[this.currentPlayerIndex].eliminated && attempts < this.players.length) {
            this.currentPlayerIndex = (this.currentPlayerIndex + 1) % this.players.length;
            attempts++;
        }
    }

    nextTurn() {
        const currentPlayer = this.players[this.currentPlayerIndex];

        if (currentPlayer.eliminated) {
            this.currentPlayerIndex = (this.currentPlayerIndex + 1) % this.players.length;
            this.nextTurn();
            return;
        }

        document.getElementById('current-player').textContent =
            `Spelare: ${currentPlayer.name}`;

        if (currentPlayer.isHuman) {
            this.highlightValidCards();
        } else {
            setTimeout(() => this.makeComputerMove(), 1000);
        }
    }

    highlightValidCards() {
        const player = this.players[0];
        const validCards = player.getValidCards(this.highCard);

        const cardElements = document.querySelectorAll('#player-hand .card');
        cardElements.forEach((element, index) => {
            const card = player.hand[index];
            const isValid = validCards.some(vc =>
                vc.suit === card.suit && vc.rank === card.rank
            );

            if (isValid) {
                element.classList.add('playable');
                element.classList.remove('disabled');
                element.onclick = () => this.humanPlayCard(card);
            } else {
                element.classList.remove('playable');
                element.classList.add('disabled');
                element.onclick = null;
            }
        });
    }

    humanPlayCard(card) {
        const player = this.players[0];
        const playedCard = player.playCard(card);

        if (playedCard) {
            this.playCard(0, playedCard);
        }
    }

    makeComputerMove() {
        const player = this.players[this.currentPlayerIndex];
        const validCards = player.getValidCards(this.highCard);

        // Use strategic decision making
        const cardToPlay = this.chooseStrategicCard(this.currentPlayerIndex, validCards);
        const playedCard = player.playCard(cardToPlay);

        if (playedCard) {
            this.playCard(this.currentPlayerIndex, playedCard);
        }
    }

    // Decide a card using Perfect Information Monte Carlo (PIMC):
    // 1. Sample many opponent hands consistent with what's been seen.
    // 2. For each candidate card, play it then roll out the rest of the round
    //    using a heuristic policy for every player.
    // 3. Score the resulting end-of-round state with a utility tuned to the
    //    current scoreboard (closeness to 50, opponent count) and pick the
    //    card with the best average utility across determinizations.
    chooseStrategicCard(playerIndex, validCards) {
        if (validCards.length === 1) return validCards[0];

        const numSims = this.calculateSimCount(playerIndex);
        const stats = validCards.map(c => ({ card: c, total: 0, count: 0 }));

        const scoresBefore = this.players.map(p => p.score);
        const eliminatedBefore = this.players.map(p => p.eliminated);

        for (let s = 0; s < numSims; s++) {
            const determinizedHands = this.determinize(playerIndex);
            if (!determinizedHands) continue;

            for (const entry of stats) {
                const sim = this.createSimGame(determinizedHands);
                sim.playCard(playerIndex, entry.card);
                sim.simulateToEnd();
                entry.total += this.evaluateSimOutcome(sim, playerIndex, scoresBefore, eliminatedBefore);
                entry.count++;
            }
        }

        let best = stats[0];
        let bestAvg = best.count > 0 ? best.total / best.count : -Infinity;
        for (const entry of stats) {
            if (entry.count === 0) continue;
            const avg = entry.total / entry.count;
            if (avg > bestAvg) {
                bestAvg = avg;
                best = entry;
            }
        }
        return best.card;
    }

    calculateSimCount(playerIndex) {
        const cardsInHand = this.players[playerIndex].hand.length;
        const activeCount = this.getActivePlayers().length;
        if (cardsInHand <= 1) return 1;
        if (cardsInHand === 2) return 80;
        if (cardsInHand === 3) return 140;
        return Math.max(80, Math.min(220, Math.round(800 / activeCount)));
    }

    determinize(myIndex) {
        const knownKeys = new Set();
        this.players[myIndex].hand.forEach(c => knownKeys.add(`${c.value}-${c.suit}`));
        for (const pile of Object.values(this.playerPiles)) {
            for (const c of pile) knownKeys.add(`${c.value}-${c.suit}`);
        }

        const unknownCards = [];
        const suits = ['hearts', 'diamonds', 'clubs', 'spades'];
        for (const suit of suits) {
            for (let rank = 1; rank <= 13; rank++) {
                const value = rank === 1 ? 14 : rank;
                if (!knownKeys.has(`${value}-${suit}`)) {
                    unknownCards.push(new Card(suit, rank));
                }
            }
        }

        for (let attempt = 0; attempt < 30; attempt++) {
            for (let i = unknownCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [unknownCards[i], unknownCards[j]] = [unknownCards[j], unknownCards[i]];
            }
            const dealt = this.tryDealHands(myIndex, unknownCards, false);
            if (dealt) return dealt;
        }
        return this.tryDealHands(myIndex, unknownCards, true);
    }

    tryDealHands(myIndex, unknownCards, ignoreConstraints) {
        const hands = this.players.map((p, i) => (i === myIndex ? p.hand.slice() : []));
        const remaining = unknownCards.slice();

        const opponents = [];
        for (let i = 0; i < this.players.length; i++) {
            if (i === myIndex || this.players[i].eliminated) continue;
            opponents.push({
                idx: i,
                handSize: this.players[i].hand.length,
                lowerBound: ignoreConstraints ? 2 : (this.playerMinimumCard[i] || 2)
            });
        }
        // Most-constrained opponent first to minimize dead-ends.
        opponents.sort((a, b) => b.lowerBound - a.lowerBound);

        for (const opp of opponents) {
            const dealt = [];
            for (let j = 0; j < remaining.length && dealt.length < opp.handSize; j++) {
                if (remaining[j].value >= opp.lowerBound) {
                    dealt.push(remaining[j]);
                    remaining.splice(j, 1);
                    j--;
                }
            }
            if (dealt.length < opp.handSize) return null;
            hands[opp.idx] = dealt;
        }
        return hands;
    }

    createSimGame(determinizedHands) {
        return new SimGame(
            determinizedHands,
            this.currentPlayerIndex,
            this.trickCards,
            this.trickPlayers,
            this.highCard,
            this.highCardPlayerIndex,
            this.players.map(p => p.score),
            this.players.map(p => p.eliminated)
        );
    }

    // Utility from the perspective of the deciding player. The score-factor
    // ramps from 1× at score 0 to 6× at score 49 so points hurt much more as
    // a player nears the 50-point elimination threshold. Eliminations dominate
    // any single-round point swing.
    evaluateSimOutcome(sim, myIndex, scoresBefore, eliminatedBefore) {
        let utility = 0;

        const myDelta = sim.scores[myIndex] - scoresBefore[myIndex];
        const myJustEliminated = sim.eliminated[myIndex] && !eliminatedBefore[myIndex];
        const myFactor = 1 + (scoresBefore[myIndex] / 50) * 5;
        if (myJustEliminated) {
            utility -= 1500;
        } else {
            utility -= myDelta * myFactor;
        }

        let activeOpponents = 0;
        for (let i = 0; i < this.players.length; i++) {
            if (i !== myIndex && !eliminatedBefore[i]) activeOpponents++;
        }
        if (activeOpponents > 0) {
            for (let i = 0; i < this.players.length; i++) {
                if (i === myIndex || eliminatedBefore[i]) continue;
                const oppDelta = sim.scores[i] - scoresBefore[i];
                const oppJustEliminated = sim.eliminated[i] && !eliminatedBefore[i];
                const oppFactor = 1 + (scoresBefore[i] / 50) * 5;
                if (oppJustEliminated) {
                    utility += 600 / activeOpponents;
                } else {
                    utility += oppDelta * oppFactor * 0.5 / activeOpponents;
                }
            }
        }

        return utility;
    }

    playCard(playerIndex, card) {
        this.trickCards.push(card);
        this.trickPlayers.push(playerIndex);

        // Add card to player's pile
        this.playerPiles[playerIndex].push(card);

        // Track played cards
        this.playedCards.add(`${card.value}-${card.suit}`);
        this.remainingCardsByValue[card.value]--;

        // Update minimum card knowledge
        this.updateMinimumCardKnowledge(playerIndex, card);

        if (!this.highCard || card.value > this.highCard.value) {
            this.highCard = card;
            this.highCardPlayerIndex = playerIndex;
        }

        this.updateDisplay();

        if (this.trickCards.length === this.getActivePlayers().length) {
            setTimeout(() => this.endTrick(), 1500);
        } else {
            do {
                this.currentPlayerIndex = (this.currentPlayerIndex + 1) % this.players.length;
            } while (this.players[this.currentPlayerIndex].eliminated);

            this.nextTurn();
        }
    }

    updateMinimumCardKnowledge(playerIndex, playedCard) {
        // Called before this.highCard is updated for the current play, so it
        // still holds the high card the player was responding to. If a player
        // followed by playing a card that did not beat that high card, the
        // rules force the card to have been their lowest — every remaining
        // card in their hand must therefore be strictly higher.
        if (this.highCard && playedCard.value <= this.highCard.value) {
            const inferred = playedCard.value + 1;
            const current = this.playerMinimumCard[playerIndex] || 2;
            if (inferred > current) {
                this.playerMinimumCard[playerIndex] = inferred;
            }
        }
    }

    getActivePlayers() {
        return this.players.filter(p => !p.eliminated);
    }

    endTrick() {
        const activePlayers = this.getActivePlayers();

        if (activePlayers.every(p => p.hand.length === 0)) {
            this.endRound();
        } else {
            this.currentPlayerIndex = this.highCardPlayerIndex;
            this.trickCards = [];
            this.trickPlayers = [];
            this.highCard = null;
            this.highCardPlayerIndex = null;
            this.updateDisplay();
            this.nextTurn();
        }
    }

    endRound() {
        const lastTrickWinners = [];
        let highestValue = 0;

        this.trickCards.forEach((card, index) => {
            if (card.value > highestValue) {
                highestValue = card.value;
                lastTrickWinners.length = 0;
                lastTrickWinners.push(this.trickPlayers[index]);
            } else if (card.value === highestValue) {
                lastTrickWinners.push(this.trickPlayers[index]);
            }
        });

        let messages = [];

        lastTrickWinners.forEach(playerIndex => {
            const player = this.players[playerIndex];
            const card = this.trickCards[this.trickPlayers.indexOf(playerIndex)];

            if (card.value === 14) {
                player.eliminated = true;
                messages.push(`${player.name} fick ett ess och är utslagen!`);
            } else {
                player.score += card.value;
                messages.push(`${player.name} fick ${card.value} poäng!`);
                if (player.score >= 50) {
                    player.eliminated = true;
                    messages.push(`${player.name} har ${player.score} poäng och är utslagen!`);
                }
            }
        });

        this.updateScoreboard();

        // Show continue button with messages
        this.showRoundEndModal(messages);
    }

    showRoundEndModal(messages) {
        const modal = document.getElementById('round-end-modal');
        const messageDiv = document.getElementById('round-end-message');
        messageDiv.innerHTML = messages.join('<br>');
        modal.classList.remove('hidden');
    }

    continueAfterRound() {
        const modal = document.getElementById('round-end-modal');
        modal.classList.add('hidden');

        const activePlayers = this.getActivePlayers();
        if (activePlayers.length === 1) {
            this.gameOver(activePlayers[0]);
        } else if (activePlayers.length === 0) {
            const gameStatus = document.getElementById('game-status');
            gameStatus.innerHTML = '<div class="winner-message">Alla spelare utslagen! Spelet är slut!</div>';
            this.gameActive = false;
        } else {
            do {
                this.currentPlayerIndex = (this.currentPlayerIndex + 1) % this.players.length;
            } while (this.players[this.currentPlayerIndex].eliminated);

            this.startNewRound();
        }
    }

    gameOver(winner) {
        const gameStatus = document.getElementById('game-status');
        gameStatus.innerHTML = `<div class="winner-message">${winner.name} vann!</div>`;
        this.gameActive = false;
    }

    updateDisplay() {
        this.updatePlayerHand();
        this.updatePlayerPiles();
        this.updateScoreboard();
    }

    updatePlayerHand() {
        const handDiv = document.getElementById('player-hand');
        const player = this.players[0];

        handDiv.innerHTML = '';

        player.hand.forEach(card => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            if (card.isRed()) cardDiv.classList.add('red');

            cardDiv.innerHTML = `
                <div class="card-corner">
                    <div class="card-corner-rank">${card.getDisplayRank()}</div>
                    <div class="card-corner-suit">${card.getSuitSymbol()}</div>
                </div>
                <div class="card-rank">${card.getDisplayRank()}</div>
                <div class="card-suit">${card.getSuitSymbol()}</div>
            `;

            handDiv.appendChild(cardDiv);
        });
    }

    updatePlayerPiles() {
        const pilesDiv = document.getElementById('player-piles');
        pilesDiv.innerHTML = '';

        this.players.forEach((player, index) => {
            const pileDiv = document.createElement('div');
            pileDiv.className = 'player-pile';

            const nameDiv = document.createElement('div');
            nameDiv.className = 'pile-name';
            if (player.eliminated) {
                nameDiv.classList.add('eliminated');
            }
            nameDiv.textContent = player.name;
            if (!player.eliminated) {
                nameDiv.textContent += ` (${player.hand.length} kort)`;
            }

            const cardsDiv = document.createElement('div');
            cardsDiv.className = 'pile-cards';

            const playerCards = this.playerPiles[index] || [];
            playerCards.forEach((card, cardIndex) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card pile-card';
                if (card.isRed()) cardDiv.classList.add('red');

                // Check if this is the current high card
                if (this.highCard && card === this.highCard && this.trickCards.includes(card)) {
                    cardDiv.classList.add('high-card');
                }

                cardDiv.style.left = `${cardIndex * 25}px`;
                cardDiv.style.zIndex = cardIndex;

                cardDiv.innerHTML = `
                    <div class="card-corner">
                        <div class="card-corner-rank">${card.getDisplayRank()}</div>
                        <div class="card-corner-suit">${card.getSuitSymbol()}</div>
                    </div>
                    <div class="card-rank">${card.getDisplayRank()}</div>
                    <div class="card-suit">${card.getSuitSymbol()}</div>
                `;

                cardsDiv.appendChild(cardDiv);
            });

            pileDiv.appendChild(nameDiv);
            pileDiv.appendChild(cardsDiv);
            pilesDiv.appendChild(pileDiv);
        });
    }

    updateScoreboard() {
        const scoresDiv = document.getElementById('scores');
        scoresDiv.innerHTML = '';

        this.players.forEach(player => {
            const scoreRow = document.createElement('div');
            scoreRow.className = 'score-row';
            if (player.eliminated) scoreRow.classList.add('eliminated');

            scoreRow.innerHTML = `
                <span>${player.name}</span>
                <span>${player.score} poäng</span>
            `;

            scoresDiv.appendChild(scoreRow);
        });
    }
}

        game = new GurkaGame();
